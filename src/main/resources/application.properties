spring.application.name=zipmart-backend-spring
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:zipmart}
spring.datasource.username=${DB_USER:zipmart}
spring.datasource.password=${DB_PASSWORD:zipmart}

# Schema is owned by Flyway migrations, not Hibernate — never let JPA
# create/alter tables, especially behavior_events which it doesn't own.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration
# This database is shared with zipmart-backend-nest, whose TypeORM
# migrations already created users/products/orders/etc. Flyway sees a
# non-empty "public" schema with no flyway_schema_history table and refuses
# to run without this — baselining at version 0 means it only ever applies
# migrations *after* that point (i.e. just this repo's own V1+), never
# touches the pre-existing tables it doesn't own.
spring.flyway.baseline-on-migrate=true
# Default baseline-version is 1, which collides with our own V1 migration —
# baselining AT version 1 makes Flyway think V1 is already applied and skip
# it. Baseline at 0 instead so V1 actually runs.
spring.flyway.baseline-version=0
